:root{
  --stone:#FDFFF2;
  --evergreen:#23392F;
  --forest:#192520;
  --highlight:#F0FE91;
  --sage:#9EAF9F;
  --shadow:rgba(25,37,32,.35);
  --serif:"Season Mix",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  /* 8px grid at the 708px design width. Every gap and padding is a multiple of --u. */
  --u:1.13cqw;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--evergreen);color:var(--forest);font-family:var(--sans)}
body{display:grid;place-items:center}

/* 16:9 stage. Everything inside is sized in cqw, so it scales with the block width. */
#stage{
  container-type:inline-size;
  width:min(100vw,177.7778vh);
  aspect-ratio:16/9;
  background:var(--evergreen);
  padding:calc(var(--u)*2);
  display:flex;flex-direction:column;gap:calc(var(--u)*2);
  overflow:hidden;
}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:var(--u);flex:none}
.tab{
  appearance:none;font:600 max(11px,1.7cqw)/1 var(--sans);color:var(--stone);
  background:transparent;border:.2cqw solid var(--sage);border-radius:999px;
  height:calc(var(--u)*4);padding:0 var(--u);cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;
  transition:background-color .15s ease,color .15s ease;
}
.tab:hover{background:var(--forest)}
.tab[aria-selected="true"]{background:var(--highlight);border-color:var(--highlight);color:var(--forest)}
.tab:focus-visible{outline:.3cqw solid var(--highlight);outline-offset:.25cqw}

/* Card */
.card{
  flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*3);
  background:var(--stone);border-radius:calc(var(--u)*2);
  padding:calc(var(--u)*2.5) calc(var(--u)*3);
  box-shadow:0 calc(var(--u)*.5) 0 var(--shadow);
}
.head{display:flex;align-items:baseline;gap:calc(var(--u)*1.5);flex:none}
.name{font:700 4.3cqw/1 var(--serif);color:var(--forest)}
.by{font:500 max(11px,1.7cqw)/1.2 var(--sans);color:var(--evergreen)}
.chip{font:700 max(10px,1.4cqw)/1 var(--sans);background:var(--sage);color:var(--forest);border-radius:999px;padding:.55cqw 1.3cqw;align-self:center}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*1.5);flex:none}
.tile{border-radius:calc(var(--u)*1.5);padding:calc(var(--u)*1.5);border:.2cqw solid var(--evergreen);display:flex;flex-direction:column;gap:var(--u);min-height:calc(var(--u)*9)}
.tile .k{font:600 max(10.5px,1.5cqw)/1 var(--sans);display:flex;align-items:center;gap:.7cqw;color:var(--evergreen)}
.tile .v{font:700 2cqw/1.2 var(--sans);color:var(--forest)}
.g{display:inline-grid;place-items:center;width:1.9cqw;height:1.9cqw;min-width:13px;min-height:13px;border-radius:50%;font:700 max(9px,1.2cqw)/1 var(--sans)}
.tile.bad{background:var(--forest);border-color:var(--forest)}
.tile.bad .k{color:var(--sage)}
.tile.bad .v{color:var(--highlight)}
.tile.bad .g{background:var(--highlight);color:var(--forest)}
.tile.mid{background:var(--sage);border-color:var(--sage)}
.tile.mid .k,.tile.mid .v{color:var(--forest)}
.tile.mid .g{background:var(--forest);color:var(--sage)}
.tile.ok .g{background:var(--evergreen);color:var(--stone)}

/* Choose / skip */
.fit{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*4);flex:none}
.fit h3{font:700 2.4cqw/1 var(--serif);color:var(--forest);margin-bottom:var(--u)}
.fit p{font:400 max(11.5px,1.85cqw)/1.35 var(--sans);color:var(--evergreen)}

/* Watch out */
.watch{
  margin-top:auto;flex:none;background:var(--evergreen);color:var(--stone);border-radius:calc(var(--u)*1.5);
  padding:calc(var(--u)*1.5) calc(var(--u)*2);display:flex;align-items:center;gap:calc(var(--u)*2);
}
.watch b{font:700 max(10px,1.35cqw)/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--highlight);flex:none}
.watch span{font:500 max(11.5px,1.8cqw)/1.3 var(--sans)}

/* Narrow blocks (phones): essentials only, still no scroll */
@container (max-width:560px){
  #stage{padding:2.2cqw;gap:1.6cqw}
  .tabs{grid-template-columns:repeat(4,1fr);gap:.9cqw}
  .tab{height:5.4cqw;font-size:max(10px,2.5cqw)}
  .card{gap:1.4cqw;padding:2cqw 2.6cqw;border-radius:2.6cqw;box-shadow:none}
  .name{font-size:5.2cqw}
  .by{display:none}
  .tiles{grid-template-columns:1fr 1fr;gap:1.2cqw}
  .tile{min-height:0;padding:.8cqw 1.8cqw;gap:.3cqw;border-radius:1.8cqw}
  .tile .v{font-size:max(10px,2.7cqw)}
  .tile .k{font-size:max(9.5px,2.1cqw)}
  .g{width:max(10px,2.1cqw);height:max(10px,2.1cqw);min-width:10px;min-height:10px;font-size:7px}
  .fit{display:none}
  .watch{padding:1cqw 1.8cqw;border-radius:1.8cqw}
  .watch b{display:none}
  .watch span{font-size:max(10px,2.5cqw);line-height:1.2}
}

@media (prefers-reduced-motion:reduce){
  .tab{transition:none}
}
</style>
</head>

  <div class="tabs" role="tablist" aria-label="Choose an agent" id="tabs"></div>
  <section class="card" role="tabpanel" id="panel" aria-live="polite"></section>
</main>

<script>
/* One entry per agent. Tile states: bad = watch this, mid = depends or not stated, ok = fine. */
var AGENTS=[

  cost:"Free (capped), then US$20",region:"US and Canada rollout",
  train:["bad","Trains by default"],asks:["ok","Asks before sending or buying"],
  choose:"you want a low-cost way in and memory you can see and edit.",
  skip:"you want it near client, financial, or HR data, or you are outside the rollout.",
  watch:"Opt out of training in settings first. Full deletion isn't documented."},
 {tab:"Grok Bot",name:"Grok Bot",by:"SpaceX, through SpaceXAI and Cursor",
  cost:"US$20",region:"Not stated",
  train:["mid","Not stated, opt-out available"],asks:["ok","Yes, before acting on your computer"],
  choose:"you want low-stakes recurring routines on a computer that keeps running.",
  skip:"you need a stated training policy or a verified full export.",
  watch:"Working files persist, and there is no verified full export."},
 {tab:"dots",name:"OpenAI dots",by:"OpenAI",
  cost:"US$100",region:"Pro excludes EEA, UK, Switzerland",
  train:["mid","Depends on plan"],asks:["ok","Yes, you set the level"],
  choose:"most of your AI context already lives in ChatGPT.",
  skip:"you are on Pro in the EEA, UK, or Switzerland.",
  watch:"Its memories can flow into ChatGPT's. Delete the dot to clear its memory."},
 {tab:"Spark",name:"Gemini Spark",by:"Google",
  cost:"US$19.99",region:"Excludes EEA, Nigeria, Switzerland, UK",
  train:["bad","Yes, while Keep Activity is on"],asks:["ok","Yes"],
  choose:"most of your context already lives in Google.",
  skip:"you need activity saving off, or you are in an excluded region.",
  watch:"Spark can't run with Keep Activity off. If that's a dealbreaker, rule it out."},
 {tab:"Poke",name:"Poke",by:"The Interaction Company of California, owned by Cognition",
  cost:"Free, then US$19",region:"Not stated",
  train:["bad","Yes, unless Maximum Privacy"],asks:["bad","None documented"],
  choose:"you want to try an agent on a free tier first.",
  skip:"you need approval before it sends, since none is documented.",
  watch:"Turn on Maximum Privacy first. Your exit is deleting the account, and backups may linger."},
 {tab:"Hermes",name:"Hermes Agent",by:"Nous Research, open source",
  cost:"Free software",region:"Your hardware",
  train:["mid","Depends on provider"],asks:["mid","Risky commands only"],
  choose:"you want to pick your own model provider and someone will maintain the setup.",
  skip:"nobody will keep a self-run setup secured and up to date.",
  watch:"You secure it yourself. Edit or move the memory files when you want your data back."},
 {tab:"OpenClaw",name:"OpenClaw",by:"OpenClaw Foundation, a nonprofit, open source",
  cost:"Free software",region:"Your hardware",
  train:["mid","Depends on provider"],asks:["bad","No"],
  choose:"you want to pick your own model provider and can maintain the setup.",

  watch:"In February 2026 Gartner called self-hosted OpenClaw an unacceptable risk for companies, partly for plain-text credentials."},
 {tab:"Instinct",name:"Instinct",by:"Spear Street Technology",flag:"Watchlist",
  cost:"Not published",region:"Private beta",
  train:["bad","Yes"],asks:["bad","None published"],
  choose:"you want to track it for later.",
  skip:"you need something you can use now, since it is in private beta.",
  watch:"TechCrunch found it sent an email without approval and kept summarizing an inbox after Gmail was disconnected."}
];
var GLYPH={bad:"!",mid:"~",ok:"✓"};
var tabsEl=document.getElementById("tabs"),panel=document.getElementById("panel");
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tile(k,v,state){
  var g=state?'<i class="g">'+GLYPH[state]+'</i>':'';
  return '<div class="tile '+(state||'')+'"><div class="k">'+g+k+'</div><div class="v">'+esc(v)+'</div></div>';
}
function show(i){
  var a=AGENTS[i];
  Array.prototype.forEach.call(tabsEl.children,function(b,j){b.setAttribute("aria-selected",j===i?"true":"false");b.tabIndex=j===i?0:-1});
  panel.innerHTML=
   '<div class="head"><div class="name">'+esc(a.name)+'</div>'+(a.flag?'<span class="chip">'+esc(a.flag)+'</span>':'')+'<div class="by">'+esc(a.by)+'</div></div>'+
   '<div class="tiles">'+tile("Cost",a.cost)+tile("Region",a.region)+tile("Training",a.train[1],a.train[0])+tile("Asks first?",a.asks[1],a.asks[0])+'</div>'+
   '<div class="fit"><div><h3>Choose it if</h3><p>'+esc(a.choose)+'</p></div><div><h3>Skip it if</h3><p>'+esc(a.skip)+'</p></div></div>'+
   '<div class="watch"><b>Watch out</b><span>'+esc(a.watch)+'</span></div>';
}
AGENTS.forEach(function(a,i){
  var b=document.createElement("button");
  b.className="tab";b.setAttribute("role","tab");
  b.textContent=a.tab;
  b.addEventListener("click",function(){show(i)});
  b.addEventListener("keydown",function(e){
    var n=i;
    if(e.key==="ArrowRight")n=(i+1)%8;else if(e.key==="ArrowLeft")n=(i+7)%8;else return;
    e.preventDefault();show(n);tabsEl.children[n].focus();
  });
  tabsEl.appendChild(b);
});
show(0);
</script>
